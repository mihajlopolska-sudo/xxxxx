<!doctype html>
<html>
<head>
  <title>Ptoszek</title>
  <meta charset='UTF-8'>
    <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'avenir next', avenir,
        'helvetica neue', helvetica, ubuntu, roboto, noto, 'segoe ui', arial,
        sans-serif;
      overflow: hidden;
    }
    .hello-message {
      margin: 40px;
      text-align: center;
    }
    .hello-message h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .hello-message h2 {
      font-size: 1.5rem;
      color: #1e3a8a;
      margin-top: 0;
      margin-bottom: 6px;
    }
    .hello-message h3 {
      font-size: 1.1rem;
      color: #4b5563;
      margin-top: 0;
      font-weight: normal;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
    }
    img {
      width: 300px;
    }
    .homescreen-car {
      width: 420px;
      max-width: 90vw;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-block;
    }
    .homescreen-car:hover {
      transform: scale(1.02);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
    }
    .homescreen-car:active {
      transform: scale(0.98);
    }
    @keyframes blurslowly {
      0% {
        filter: none;
      }
      92% {
        filter: blur(0);
      }
      96% {
        filter: blur(1px);
      }
      100% {
        filter: blur(0);
      }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="media/images/ptok.jpg">

  <meta property="og:title" content="Ptoszek" />

  <meta name="keywords" content="ptoszek, ptok, ptoszek.pl, ptok.pl">
  <meta name="description" content="Obejrzyj zdjęcia Ptaków za frytę!">
  <meta name="theme-color" content="#34eb7d">
</head>

    <h3>(albo kliknij w auto)</h3>

    <img src='media/images/audi_niebieskie.svg' alt='Niebieskie Audi - kliknij żeby dodać gazu' class='homescreen-car' />
  </div>
  <div class='logout-messages'></div>
</template>
